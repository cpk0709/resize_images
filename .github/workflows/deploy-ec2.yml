# EC2 배포. main 에 push 될 때마다 standalone 빌드를 만들어 SSH 로 올리고 서비스를 교체한다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST     서버 탄력적 IP 또는 도메인
#   EC2_USER     SSH 계정 (setup.sh 의 DEPLOY_USER, 기본 ubuntu)
#   EC2_SSH_KEY  배포용 개인키 (ed25519) 전체 내용
# 서버 쪽 준비는 deploy/ec2/setup.sh 를 한 번 실행하면 끝난다 (README "배포 (EC2)").
name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포는 순서대로. 진행 중인 배포를 취소하면 반쯤 올라간 상태가 될 수 있어 취소하지 않는다.
concurrency:
  group: ec2-deploy
  cancel-in-progress: false

env:
  # postinstall 의 `prisma generate` 가 prisma7.config.ts 를 읽을 때 필요한 형식상 값. 실제 DB 에 접속하지 않는다.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 시크릿이 아직 없으면(서버 준비 전) 조용히 건너뛴다.
    if: ${{ vars.EC2_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check & lint
        run: npm run typecheck && npm run lint

      - name: Build standalone
        run: npm run build:standalone

      - name: Pack
        run: tar -czf release.tgz -C .next/standalone .

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload & release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SHA: ${{ github.sha }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes $EC2_USER@$EC2_HOST"
          scp -i ~/.ssh/deploy_key release.tgz "$EC2_USER@$EC2_HOST:/srv/docufit/releases/incoming-$SHA.tgz"
          # release.sh 가 바뀌었을 수 있으니 매번 최신 것을 올린다
          scp -i ~/.ssh/deploy_key deploy/ec2/release.sh "$EC2_USER@$EC2_HOST:/srv/docufit/bin/release.sh"
          $SSH "chmod +x /srv/docufit/bin/release.sh && /srv/docufit/bin/release.sh /srv/docufit/releases/incoming-$SHA.tgz $SHA"

      - name: Verify headers
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # 도메인·HTTPS 가 아직 없으면 HTTP 로 확인한다. no-store 와 nosniff 가 붙어야 한다.
          URL="http://$EC2_HOST/"
          curl -sSI --max-time 20 "$URL" | tee headers.txt
          grep -qi "cache-control: no-store" headers.txt
          grep -qi "x-content-type-options: nosniff" headers.txt
