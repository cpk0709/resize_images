# DocuFit — 도메인 연결 전 임시 공개용 (HTTP, 별도 포트). setup-shared.sh 가 __PORT__ 를 채워 sites-enabled/docufit 로 설치한다.
# 기존 80/443 가상호스트들과 겹치지 않도록 다른 포트에서만 듣는다. 도메인이 생기면 docufit.conf 로 교체된다.
# 캐시·보안 헤더는 Next 가 붙인다 (next.config.ts headers).

server {
  listen __PORT__;
  listen [::]:__PORT__;
  server_name _;

  client_max_body_size 60m;

  log_format docufit_port_min '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';
  access_log /var/log/nginx/docufit.access.log docufit_port_min;
  error_log /var/log/nginx/docufit.error.log warn;

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
