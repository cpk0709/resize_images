# DocuFit nginx 가상호스트 (도메인 모드). setup 스크립트가 __SERVER_NAME__ 을 도메인으로 바꿔 sites-enabled/docufit 로 설치한다.
# HTTPS 블록과 80→443 리다이렉트는 certbot --nginx 가 도메인 확인 뒤 이 파일에 추가한다.
#
# 역할: TLS 종단, 127.0.0.1:3100 의 DocuFit 컨테이너(또는 전용 인스턴스의 Node 서비스)로 프록시.
# 보안 헤더(no-store, nosniff, DENY, no-referrer)와 캐시 정책은 Next 가 붙이므로 여기서 중복 설정하지 않는다.
# HSTS 만 여기서 (Next 는 프로토콜을 모른다) — certbot 이 HTTPS 를 켠 뒤에 유효하다.

server {
  listen 80;
  listen [::]:80;
  server_name __SERVER_NAME__;

  # 서버 처리 옵션(Phase 3)에서 받을 이미지 상한. MAX_UPLOAD_MB(기본 50) 보다 조금 크게.
  client_max_body_size 60m;

  # 접속 로그에 쿼리스트링·리퍼러를 남기지 않는다 (형식은 conf.d/docufit-logformat.conf).
  access_log /var/log/nginx/docufit.access.log docufit_min;
  error_log /var/log/nginx/docufit.error.log warn;

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
